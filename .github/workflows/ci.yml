name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend testi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Namesti odvisnosti
        run: npm ci

      - name: Zaženi teste s pokritostjo
        run: npm run coverage

      - name: Naloži poročilo o pokritosti (backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  frontend-tests:
    name: Frontend testi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Namesti odvisnosti
        run: npm ci

      - name: Zaženi teste s pokritostjo
        run: npm run coverage

      - name: Naloži poročilo o pokritosti (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  # -------------------------------------------------------------
  # GRADNJA aplikacije (po uspešnih testih)
  # -------------------------------------------------------------
  build:
    name: Gradnja
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Namesti odvisnosti (frontend)
        working-directory: frontend
        run: npm ci

      - name: Zgradi frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Naloži gradbeni rezultat (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # -------------------------------------------------------------
  # DOCKER: gradnja in nalaganje slik na Docker Hub
  # (samo ob push na main)
  # -------------------------------------------------------------
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavi Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prijava v Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend slike
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/apart-alert-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/apart-alert-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend slike
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/apart-alert-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/apart-alert-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # -------------------------------------------------------------
  # DEPLOY na Render (sproži redeploy prek deploy hookov)
  # -------------------------------------------------------------
  deploy:
    name: Deploy na Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Sproži deploy backenda
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_BACKEND ni nastavljen – preskakujem deploy backenda."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

      - name: Sproži deploy frontenda
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_FRONTEND ni nastavljen – preskakujem deploy frontenda."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"
