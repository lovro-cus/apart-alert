# SonarCloud konfiguracija (vaja 6)
# !! Pred uporabo zamenjaj projectKey in organization s svojima iz SonarCloud. !!
sonar.projectKey=lovro-cus_apart-alert
sonar.organization=lovro-cus

sonar.host.url=https://sonarcloud.io

# Katero kodo analiziramo (backend + frontend).
sonar.sources=backend,frontend/src

# Izključitve – knjižnice, gradbeni rezultati, poročila in testne datoteke.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/*.test.jsx,backend/tests/**

# Poročila o pokritosti s testi (lcov) za oba dela aplikacije.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
